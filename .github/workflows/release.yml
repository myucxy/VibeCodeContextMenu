name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 1.0.0；留空则读取 windows/VERSION）'
        required: false
        type: string
      draft:
        description: '创建为草稿 Release（Draft）'
        required: false
        default: false
        type: boolean
      prerelease:
        description: '标记为预发布版本（Pre-release）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Determine version and tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"
            TAG="$RAW_TAG"
          else
            INPUT_VER="${{ inputs.version }}"
            if [[ -n "$INPUT_VER" ]]; then
              VERSION="${INPUT_VER#v}"
            else
              VERSION="$(tr -d '[:space:]' < windows/VERSION)"
            fi
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION} (tag: ${TAG})"

  build-windows:
    name: Build Windows (x64 & arm64 ZIP + Setup)
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pack Windows binaries & Inno Setup installers
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File windows\pack.ps1 `
            -Runtime all `
            -Version "${{ needs.prepare.outputs.version }}" `
            -OutputDir "${{ github.workspace }}\dist" `
            -InnoSetup
          Get-ChildItem dist | Select-Object Name, @{n='SizeMiB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  build-macos:
    name: Build macOS (Universal DMG + PKG)
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0

      - name: Pack macOS Universal DMG & PKG
        run: |
          chmod +x macos/pack.sh macos/build.sh macos/launcher/launch-vibecode-tool.sh
          bash macos/pack.sh \
            --version "${{ needs.prepare.outputs.version }}" \
            --arch universal \
            --pkg \
            --output-dir dist
          ls -lh dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [prepare, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: VibeCode Context Menu ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          files: release-assets/*
